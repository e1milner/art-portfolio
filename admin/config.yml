backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "artworks"
    label: "Artworks"
    files:
      - name: "gallery"
        label: "Art Gallery"
        file: "data/artworks.json"
        fields:
          - label: "Artworks"
            name: "artworks"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["ICEBORN", "Comics", "Illustrations"]
              - { label: "Description", name: "description", widget: "text", required: false }